<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blood Pressure FAQ Chatbot</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="header">

            <div class="header-icon">
                🩺
            </div>

            <div>
                <h1>Blood Pressure FAQ Chatbot</h1>
                <p>Ask questions about your digital blood pressure monitor</p>
            </div>

        </div>


        <!-- Chat area -->
        <div id="chat-box" class="chat-box">

            <div class="chat-row bot-row">

                <div class="bot-icon">
                    🤖
                </div>

                <div>
                    <div class="sender-name">Chatbot</div>

                    <div class="message bot-message">
                        Hello! Ask me anything about your digital blood pressure monitor.
                    </div>
                </div>

            </div>

        </div>


        <!-- Input area -->
        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Type your question..."
                autocomplete="off"
            >

            <button onclick="sendQuestion()">
                SEND
            </button>

        </div>

    </div>


    <script>

        async function sendQuestion() {

            const input = document.getElementById("question");
            const question = input.value.trim();

            if (question === "") {
                return;
            }

            const chatBox = document.getElementById("chat-box");


            // User message
            chatBox.innerHTML += `
                <div class="chat-row user-row">

                    <div>
                        <div class="sender-name user-name">You</div>

                        <div class="message user-message">
                            ${question}
                        </div>
                    </div>

                    <div class="user-icon">
                        👤
                    </div>

                </div>
            `;


            input.value = "";


            // Send question to Flask
            const response = await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })

            });


            const data = await response.json();


            // Chatbot response
            chatBox.innerHTML += `
                <div class="chat-row bot-row">

                    <div class="bot-icon">
                        🤖
                    </div>

                    <div>
                        <div class="sender-name">Chatbot</div>

                        <div class="message bot-message">
                            ${data.answer}
                        </div>
                    </div>

                </div>
            `;


            // Automatically scroll to latest message
            chatBox.scrollTop = chatBox.scrollHeight;
        }


        // Press Enter to send
        document.getElementById("question").addEventListener("keypress", function(event) {

            if (event.key === "Enter") {
                sendQuestion();
            }

        });

    </script>

</body>
</html>
